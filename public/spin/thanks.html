<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're All Set | New York's Best Experiences</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="wrap">
  <a href="https://www.newyorksbestexperiences.com" aria-label="New York's Best Experiences">
    <img class="logo" src="../assets/nybe-logo.png" alt="New York's Best Experiences">
  </a>
  <div class="card thanks-card">
    <div class="thanks-icon spin">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 12 L12 3 A9 9 0 0 1 19.79 7.5 Z" fill="#EE6E31"/>
        <path d="M12 12 L19.79 7.5 A9 9 0 0 1 19.79 16.5 Z" fill="#5C4A42"/>
        <path d="M12 12 L19.79 16.5 A9 9 0 0 1 12 21 Z" fill="#EE6E31"/>
        <path d="M12 12 L12 21 A9 9 0 0 1 4.21 16.5 Z" fill="#5C4A42"/>
        <path d="M12 12 L4.21 16.5 A9 9 0 0 1 4.21 7.5 Z" fill="#EE6E31"/>
        <path d="M12 12 L4.21 7.5 A9 9 0 0 1 12 3 Z" fill="#5C4A42"/>
        <circle cx="12" cy="12" r="9" fill="none" stroke="#3E2A21" stroke-width="0.5"/>
        <circle cx="12" cy="12" r="2" fill="#FFFDF8" stroke="#3E2A21" stroke-width="0.8"/>
      </svg>
    </div>
    <h1>All set! You're&nbsp;ready to spin the wheel!</h1>
    <p id="body-copy">We also sent a little goodie to your inbox. Be sure you got it (check spam if you don't see it) and stick around for the best New York State tips!</p>
  </div>
</div>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var raw = params.get('interests');
    if (!raw) return;
    var items = raw.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    if (!items.length) return;

    function formatList(list) {
      list = list.slice();
      list[0] = list[0].charAt(0).toUpperCase() + list[0].slice(1);
      if (list.length === 1) return list[0];
      if (list.length === 2) return list[0] + ' and ' + list[1];
      return list.slice(0, -1).join(', ') + ' and ' + list[list.length - 1];
    }

    document.getElementById('body-copy').textContent =
      "We also sent a little goodie to your inbox. Be sure you got it (check spam if you don't see it) and stick around for the best tips for " +
      formatList(items) + ' in New York State!';
  })();
</script>
</body>
</html>
